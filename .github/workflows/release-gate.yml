name: release-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Feature contract gate
        run: npm run feature:contract

      - name: Payment priority gate
        run: npm run payment:priority

      - name: Feature retention tests
        run: npm run feature:retention

      - name: Full unit test suite
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

