name: release-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Feature contract gate
        run: npm run feature:contract

      - name: Payment priority gate
        run: npm run payment:priority

      - name: Feature retention tests
        run: npm run feature:retention

      - name: Full unit test suite
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        # Turbopack fails the Noto Sans TC lookup with "queries have exactly one entry".
        # Webpack completes the same production build. The Google font CSS fetch
        # sometimes returns a body the loader cannot parse, so retry that build.
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npx next build --webpack; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            echo "Webpack build failed on attempt ${attempt}; retrying"
            sleep 15
          done

