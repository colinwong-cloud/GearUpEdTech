<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>語音倒數計時｜增分寶 GearUp Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      background-color: #f0f9ff;
      color: #111827;
      min-height: 100dvh;
    }
    .page {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 96px;
      max-width: 100%;
      overflow-x: hidden;
    }
    .site-header {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 16px;
    }
    .site-header a.logo-link { display: flex; align-items: center; text-decoration: none; }
    .site-header img { max-height: 40px; object-fit: contain; width: auto; }
    .home-link {
      font-size: 14px;
      font-weight: 600;
      color: #4338ca;
      text-decoration: none;
      white-space: nowrap;
    }
    .home-link:hover { text-decoration: underline; }
    .container {
      background: #fff;
      border: 1px solid #f3f4f6;
      border-radius: 16px;
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
      padding: 24px;
      max-width: 440px;
      width: 100%;
      text-align: left;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #111827;
      margin: 0 0 4px;
      text-align: left;
    }
    .subline {
      font-size: 14px;
      color: #6b7280;
      margin: 0 0 16px;
    }
    .field { margin-bottom: 14px; text-align: left; }
    label {
      font-size: 14px;
      font-weight: 600;
      color: #374151;
      display: block;
      margin-bottom: 4px;
      width: 100%;
    }
    label.pitch-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }
    .value-label { font-size: 12px; color: #6b7280; font-weight: 400; flex-shrink: 0; }
    .hint {
      font-size: 12px;
      color: #6b7280;
      margin: -4px 0 12px;
      text-align: left;
    }
    input[type="number"],
    select,
    input[type="range"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 2px solid #e5e7eb;
      font-size: 16px;
      font-family: inherit;
      background: #fff;
      color: #111827;
    }
    input[type="range"] {
      padding: 8px 4px;
      height: 44px;
    }
    input[type="number"]:focus,
    select:focus,
    input[type="range"]:focus {
      border-color: #818cf8;
      outline: none;
    }
    .row { display: flex; gap: 8px; align-items: stretch; }
    .row select { flex: 1; min-width: 0; }
    #testBtn {
      flex-shrink: 0;
      min-height: 44px;
      padding: 0 16px;
      background-color: #eef2ff;
      border: 2px solid #c7d2fe;
      color: #4338ca;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    #testBtn:hover {
      background-color: #e0e7ff;
      border-color: #a5b4fc;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .btn-main {
      flex: 1;
      min-height: 44px;
      font-size: 16px;
      padding: 14px 12px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      color: #fff;
      font-weight: 600;
      font-family: inherit;
    }
    #startBtn { background-color: #10b981; }
    #startBtn:hover { background-color: #059669; }
    #stopBtn { background-color: #f43f5e; }
    #stopBtn:hover { background-color: #e11d48; }
    #display {
      font-family: ui-rounded, system-ui, sans-serif;
      font-size: clamp(56px, 18vw, 80px);
      font-weight: 700;
      color: #4338ca;
      margin-top: 12px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .site-footer {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: #6b7280;
      max-width: 440px;
      width: 100%;
    }
    @media (max-width: 390px) {
      .site-header img { max-height: 36px; }
    }
  </style>
</head>
<body>

<div class="page">
  <header class="site-header">
    <a class="logo-link" href="/">
      <img src="/main/gearup-quiz-logo.webp" alt="增分寶 GearUp Quiz">
    </a>
    <a class="home-link" href="/">返回主頁</a>
  </header>

  <div class="container">
    <h1>語音倒數計時</h1>
    <p class="subline">練習用語音倒數 · 增分寶</p>

    <div class="field">
      <label for="personaSelect">聲線角色</label>
      <select id="personaSelect">
        <option value="custom">—— 自訂 / 手動 ——</option>
        <option value="sweetGirl">甜美童聲</option>
        <option value="oldMan">低沉大叔</option>
        <option value="robot">機械／外星</option>
        <option value="standard" selected>標準成人聲</option>
      </select>
    </div>

    <div class="field">
      <label for="langSelect">語音語言</label>
      <select id="langSelect"><option value="">載入語言中…</option></select>
    </div>
    <p class="hint">會列出呢個瀏覽器已安裝嘅語音，包括粵語（如有提供）。</p>

    <div class="field">
      <label for="voiceSelect">選擇語音</label>
      <div class="row">
        <select id="voiceSelect"><option>載入語音中…</option></select>
        <button type="button" id="testBtn">試聽</button>
      </div>
    </div>

    <div class="field">
      <label class="pitch-label" for="pitchInput">音調 <span id="pitchVal" class="value-label">1.0</span></label>
      <input type="range" id="pitchInput" min="0.2" max="2.0" step="0.1" value="1.0">
    </div>

    <div class="field">
      <label for="speedSelect">語速</label>
      <select id="speedSelect">
        <option value="1.0">1.0×（正常）</option>
        <option value="1.2">1.2×（稍快）</option>
        <option value="1.4" selected>1.4×（快 · 建議）</option>
        <option value="1.6">1.6×（更快）</option>
      </select>
    </div>

    <div class="field">
      <label for="intervalSelect">報時間隔</label>
      <select id="intervalSelect">
        <option value="1" selected>每 1 秒</option>
        <option value="5">每 5 秒</option>
        <option value="10">每 10 秒</option>
        <option value="15">每 15 秒</option>
      </select>
    </div>

    <div class="field">
      <label for="timeInput">倒數秒數</label>
      <input type="number" id="timeInput" value="30" min="1" />
    </div>

    <div class="btn-group">
      <button type="button" id="startBtn" class="btn-main">開始</button>
      <button type="button" id="stopBtn" class="btn-main">停止</button>
    </div>

    <div id="display">30</div>
  </div>

  <footer class="site-footer">© 2026 GearUp EduTech Limited · 語音倒數計時</footer>
</div>

<script>
  let intervalId = null;
  let allVoices = [];

  const langSelect = document.getElementById('langSelect');
  const voiceSelect = document.getElementById('voiceSelect');
  const personaSelect = document.getElementById('personaSelect');
  const pitchInput = document.getElementById('pitchInput');
  const pitchVal = document.getElementById('pitchVal');
  const speedSelect = document.getElementById('speedSelect');
  const intervalSelect = document.getElementById('intervalSelect');
  const timeInput = document.getElementById('timeInput');
  const display = document.getElementById('display');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const testBtn = document.getElementById('testBtn');

  const LANGUAGE_NAMES = {
    "zh-hk": "Cantonese (Hong Kong)",
    "yue": "Cantonese",
    "yue-hk": "Cantonese (Hong Kong)",
    "zh-cn": "Mandarin (Mainland China)",
    "cmn-cn": "Mandarin (Mainland China)",
    "zh-tw": "Mandarin (Taiwan)",
    "zh-hant": "Chinese (Traditional)",
    "zh-hans": "Chinese (Simplified)",
  };

  function languageLabel(lang) {
    const key = String(lang || "").toLowerCase();
    const special = LANGUAGE_NAMES[key];
    if (special) return `${special} (${lang})`;
    try {
      const name = new Intl.DisplayNames(["en"], { type: "language" }).of(lang);
      return name ? `${name} (${lang})` : lang;
    } catch (err) {
      return lang;
    }
  }

  function languageRank(lang) {
    const key = String(lang || "").toLowerCase();
    if (key.startsWith("en")) return 0;
    if (key === "zh-hk" || key.startsWith("yue")) return 1;
    if (key.startsWith("zh") || key.startsWith("cmn")) return 2;
    return 3;
  }

  function selectedVoice() {
    const option = voiceSelect.selectedOptions[0];
    if (!option) return null;
    const name = option.getAttribute("data-name");
    const lang = option.getAttribute("data-lang");
    return allVoices.find((voice) => voice.name === name && voice.lang === lang) || null;
  }

  function voicesForLanguage(lang) {
    if (lang === "all") return allVoices.slice();
    return allVoices.filter((voice) => voice.lang === lang);
  }

  function appendVoiceOption(parent, voice) {
    const option = document.createElement("option");
    option.textContent = `${voice.name} (${voice.lang})`;
    option.value = `${voice.lang}::${voice.name}`;
    option.setAttribute("data-name", voice.name);
    option.setAttribute("data-lang", voice.lang);
    parent.appendChild(option);
  }

  function fillVoiceOptions(preferredName) {
    const lang = langSelect.value || "all";
    const voices = voicesForLanguage(lang);
    voiceSelect.innerHTML = "";
    if (!voices.length) {
      const empty = document.createElement("option");
      empty.textContent = "呢個語言暫時冇可用語音";
      voiceSelect.appendChild(empty);
      return;
    }

    const groups = new Map();
    voices.forEach((voice) => {
      const key = voice.lang || "und";
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(voice);
    });
    [...groups.keys()]
      .sort((a, b) => languageRank(a) - languageRank(b) || languageLabel(a).localeCompare(languageLabel(b)))
      .forEach((key) => {
        const group = document.createElement("optgroup");
        group.label = languageLabel(key);
        groups.get(key)
          .sort((a, b) => a.name.localeCompare(b.name))
          .forEach((voice) => appendVoiceOption(group, voice));
        voiceSelect.appendChild(group);
      });

    const match = [...voiceSelect.options].find((option) => option.getAttribute("data-name") === preferredName);
    if (match) voiceSelect.value = match.value;
  }

  function loadVoices() {
    const voices = window.speechSynthesis.getVoices();
    if (voices.length === 0) return;
    const signature = voices.map((voice) => `${voice.lang}::${voice.name}`).join("|");
    if (signature === loadVoices.signature) return;
    loadVoices.signature = signature;
    allVoices = voices;

    const previousLang = langSelect.value;
    const previousVoice = voiceSelect.selectedOptions[0]?.getAttribute("data-name");
    const langs = [...new Set(allVoices.map((voice) => voice.lang).filter(Boolean))];
    langs.sort((a, b) => languageRank(a) - languageRank(b) || languageLabel(a).localeCompare(languageLabel(b)));

    langSelect.innerHTML = "";
    const allOption = document.createElement("option");
    allOption.value = "all";
    allOption.textContent = `All languages (${langs.length})`;
    langSelect.appendChild(allOption);
    langs.forEach((lang) => {
      const option = document.createElement("option");
      option.value = lang;
      option.textContent = languageLabel(lang);
      langSelect.appendChild(option);
    });

    // Default to every installed voice so Cantonese is selectable without an English filter.
    const keepLang = previousLang === "all" || langs.includes(previousLang);
    langSelect.value = keepLang ? previousLang : "all";
    fillVoiceOptions(previousVoice);
    if (!previousVoice) applyPersonaVoice();
  }

  loadVoices();
  window.speechSynthesis.addEventListener("voiceschanged", loadVoices);
  // Chrome often returns only the built-in English voices first, then adds the
  // remote Google languages (including zh-HK Cantonese) a moment later.
  let voiceLoadTicks = 0;
  const voiceLoadTimer = setInterval(() => {
    voiceLoadTicks += 1;
    loadVoices();
    if (voiceLoadTicks >= 20) clearInterval(voiceLoadTimer);
  }, 250);

  langSelect.addEventListener("change", () => {
    fillVoiceOptions();
    applyPersonaVoice();
  });

  // Handle Character Presets
  personaSelect.addEventListener('change', () => {
    const val = personaSelect.value;
    if (val === 'sweetGirl') {
      pitchInput.value = 1.7;
      speedSelect.value = "1.2";
      selectVoiceGender('female');
    } else if (val === 'oldMan') {
      pitchInput.value = 0.5;
      speedSelect.value = "1.0";
      selectVoiceGender('male');
    } else if (val === 'robot') {
      pitchInput.value = 0.2;
      speedSelect.value = "1.4";
    } else if (val === 'standard') {
      pitchInput.value = 1.0;
      speedSelect.value = "1.4";
    }
    pitchVal.textContent = pitchInput.value;
  });

  pitchInput.addEventListener('input', () => {
    pitchVal.textContent = pitchInput.value;
    personaSelect.value = 'custom';
  });

  function selectVoiceGender(gender) {
    const options = Array.from(voiceSelect.options);
    const match = options.find(opt => {
      const name = opt.textContent.toLowerCase();
      if (gender === 'female') return name.includes('female') || name.includes('zira') || name.includes('samantha') || name.includes('victoria') || name.includes('ava');
      if (gender === 'male') return name.includes('male') || name.includes('david') || name.includes('alex') || name.includes('george') || name.includes('andrew');
      return false;
    });
    if (match) voiceSelect.value = match.value;
  }

  function applyPersonaVoice() {
    if (personaSelect.value === 'sweetGirl') selectVoiceGender('female');
    else if (personaSelect.value === 'oldMan') selectVoiceGender('male');
  }

  function chineseNumber(n) {
    n = Math.floor(Math.abs(Number(n) || 0));
    if (n === 0) return "零";
    if (n > 99999999) return String(n);
    const digits = ["零", "一", "二", "三", "四", "五", "六", "七", "八", "九"];
    const units = ["", "十", "百", "千"];
    function section(num) {
      let text = "";
      let pendingZero = false;
      for (let i = 3; i >= 0; i--) {
        const digit = Math.floor(num / (10 ** i)) % 10;
        if (digit === 0) {
          if (text) pendingZero = true;
        } else {
          if (pendingZero) text += "零";
          pendingZero = false;
          text += digits[digit] + units[i];
        }
      }
      return text;
    }
    const wan = Math.floor(n / 10000);
    const rest = n % 10000;
    let text = "";
    if (wan) text += section(wan) + "萬";
    if (wan && rest && rest < 1000) text += "零";
    if (rest) text += section(rest);
    return text.replace(/^一十/, "十");
  }

  function spokenText(kind, seconds) {
    const lang = (selectedVoice()?.lang || langSelect.value || "").toLowerCase();
    const chinese = lang.startsWith("zh") || lang.startsWith("yue") || lang.startsWith("cmn");
    const simplified = lang.startsWith("zh-cn") || lang.startsWith("zh-sg") || lang === "zh-hans" || lang.startsWith("cmn");
    if (kind === "timeup") {
      if (chinese) return simplified ? "时间到" : "時間到";
      if (lang.startsWith("ja")) return "時間です";
      if (lang.startsWith("ko")) return "시간 종료";
      return "Time is up!";
    }
    if (kind === "test") {
      if (chinese) return simplified ? "试听：三、二、一" : "試聽：三、二、一";
      if (lang.startsWith("ja")) return "テスト：3、2、1";
      if (lang.startsWith("ko")) return "테스트: 3, 2, 1";
      return "Testing character voice: 3, 2, 1";
    }
    if (chinese) return chineseNumber(seconds);
    return String(seconds);
  }

  function speak(text) {
    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text.toString());
    const voice = selectedVoice();

    if (voice) {
      utterance.voice = voice;
      utterance.lang = voice.lang;
    }

    utterance.rate = parseFloat(speedSelect.value);
    utterance.pitch = parseFloat(pitchInput.value); // Pitch controls the voice age/character sound!

    window.speechSynthesis.speak(utterance);
  }

  testBtn.addEventListener('click', () => {
    speak(spokenText("test"));
  });

  startBtn.addEventListener('click', () => {
    clearInterval(intervalId);
    window.speechSynthesis.cancel();

    let seconds = parseInt(timeInput.value, 10);
    const step = parseInt(intervalSelect.value, 10);

    if (isNaN(seconds) || seconds <= 0) return;

    display.textContent = seconds;

    if (step === 1 || seconds % step === 0) speak(spokenText("count", seconds));

    intervalId = setInterval(() => {
      seconds--;
      if (seconds > 0) {
        display.textContent = seconds;
        if (step === 1 || seconds % step === 0) speak(spokenText("count", seconds));
      } else if (seconds === 0) {
        display.textContent = 0;
        clearInterval(intervalId);
        speak(spokenText("timeup"));
      } else {
        clearInterval(intervalId);
      }
    }, 1000);
  });

  stopBtn.addEventListener('click', () => {
    clearInterval(intervalId);
    window.speechSynthesis.cancel();
    display.textContent = timeInput.value;
  });
</script>

</body>
</html>
